name: Terraform BFF Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'apply' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - run: terraform init

      - run: terraform fmt -check -recursive
        continue-on-error: true

      - run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_jwt_key: ${{ secrets.TF_VAR_JWT_KEY }}
          TF_VAR_service_url_auth: ${{ secrets.TF_VAR_SERVICE_URL_AUTH }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        env:
          TF_VAR_jwt_key: ${{ secrets.TF_VAR_JWT_KEY }}
          TF_VAR_service_url_auth: ${{ secrets.TF_VAR_SERVICE_URL_AUTH }}
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        env:
          TF_VAR_jwt_key: ${{ secrets.TF_VAR_JWT_KEY }}
          TF_VAR_service_url_auth: ${{ secrets.TF_VAR_SERVICE_URL_AUTH }}
        run: terraform destroy -auto-approve

      - name: Show Outputs
        if: success() && (github.event_name == 'push' || github.event.inputs.action == 'apply')
        run: terraform output
